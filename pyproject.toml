[project]
name = "ideal-backend"
version = "0.1.0"
description = "iDeal Backend"
authors = [
    { name = "Mehroj Majidov", email = "mekhrojmajidov@email.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cffi>=1.17.1",
    "colorlog>=6.10.1",
    "dj-database-url>=3.0.1",
    "django>=6.0.5",
    "django-soft-delete>=1.0.23",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.1",
    "django-unfold>=0.63.0",
    "whitenoise>=6.11.0",
    "django-modern-rest[msgspec,jwt,openapi,pydantic]>=0.10.0",
    "pydantic>=2.13.4",
    "psycopg2-binary>=2.9.10",
    "pycparser>=2.22",
    "pygments>=2.19.2",
    "python-decouple>=3.8",
    "requests>=2.32.5",
    "sentry-sdk>=2.34.1",
    "sqlparse>=0.5.3",
    "uvicorn>=0.37.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django-q2>=1.7.5",
    "redis>=5.2.1",
    "pillow>=12.2.0",
    "firebase-admin>=7.5.0",
    "stripe>=13.0.0",
    "django-storages[boto3]>=1.14.4",
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "django-debug-toolbar>=6.0.0",
    "django-extensions>=4.1",
    "django-query-counter>=0.4.1",
    "factory-boy>=3.3.3",
    "faker>=40.19.1",
    "freezegun>=1.5.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.0.0",
    "ruff>=0.15.15",
]

[tool.black]
line-length = 120
target-version = ["py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*.py" = ["F405"]
"*/tests/*" = ["S101"]
"*/test_*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src", "src/apps"]
testpaths = "src/tests"
log_level = "WARNING"
addopts = "-v --tb=short --strict-markers -ra -q --import-mode=importlib"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/apps", "src/api", "src/core", "src/config"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 80
skip_covered = true
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
