repos:
  - repo: local
    hooks:
      - id: build-bruno-web-docs
        name: Build Bruno web documentation
        entry: bash scripts/pre-commit-bruno-docs.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: build-dbml-web-docs
        name: Build DBML database schema documentation
        entry: bash scripts/pre-commit-dbml-docs.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
