name: Build and Deploy (Production)

on:
#  push:
#    branches: [production]
  repository_dispatch:
    types: [ trigger-deploy ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      LOCATION: ${{ secrets.LOCATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and save Docker image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Tagging image with commit: $SHORT_SHA"
          docker build -t $CONTAINER_NAME:latest -t $CONTAINER_NAME:$SHORT_SHA .
          docker save $CONTAINER_NAME:latest $CONTAINER_NAME:$SHORT_SHA | gzip > ${CONTAINER_NAME}-${SHORT_SHA}.tar.gz

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy image to server
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          scp ${CONTAINER_NAME}-${SHORT_SHA}.tar.gz \
            $SSH_USER@$SSH_HOST:$LOCATION/images/

      - name: Copy compose file to server
        run: |
          scp docker-compose.prod.yml \
            $SSH_USER@$SSH_HOST:$LOCATION/docker-compose.yml

      - name: Deploy on server
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          ssh -T $SSH_USER@$SSH_HOST << EOF
            set -ex
            docker load -i $LOCATION/images/${CONTAINER_NAME}-${SHORT_SHA}.tar.gz
            cd $LOCATION
            docker compose up -d
          EOF
