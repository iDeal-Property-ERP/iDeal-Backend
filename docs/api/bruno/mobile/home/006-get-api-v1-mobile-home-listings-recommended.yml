info:
  name: Get recommended listings mobile home
  type: http
  seq: 6
http:
  method: GET
  url: "{{base_url}}/api/v1/mobile/home/listings/recommended/"
  auth:
    type: bearer
    token: "{{auth_token}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: "# GET /api/v1/mobile/home/listings/recommended/

  Authentication: **Bearer token required**.

  ## Saved examples

  Returns up to 6 recommended listings based on user activity and favorites."
examples:
  - name: success
    request:
      url: "{{base_url}}/api/v1/mobile/home/listings/recommended/"
      method: GET
      headers:
        - name: accept
          value: application/json
        - name: authorization
          value: Bearer test-token
      params: []
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: "{\n  \"success\": true,\n  \"message\": \"OK\",\n  \"data\": {\n    \"items\": [],\n    \"count\": 0\n  }\n}"
  - name: authentication error
    request:
      url: "{{base_url}}/api/v1/mobile/home/listings/recommended/"
      method: GET
      headers:
        - name: accept
          value: application/json
      params: []
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: "{\n  \"success\": false,\n  \"error\": \"Not authenticated\",\n  \"message\": \"Not authenticated\"\n}"
