docs: '# GET /api/v1/mobile/home/listings/


  Authentication: **none**.

  Optional bearer auth is accepted to personalize the
  returned `is_favorite` flag. Invalid or missing optional auth leaves `is_favorite=false`.


  ## Request field notes


  | Field | Location | Required | Example | Notes |

  |---|---|---:|---|---|

  | `page` | query | no | `fixture-value` | non-nullable; fixture value; replace with
  a real ID when running. |

