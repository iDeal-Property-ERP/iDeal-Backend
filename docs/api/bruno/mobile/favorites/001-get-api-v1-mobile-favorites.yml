docs: '# GET /api/v1/mobile/favorites/


  Authentication: **bearer**.


  ## Request field notes


  | Field | Location | Required | Example | Notes |

  |---|---|---:|---|---|

  | `page` | query | no | `1` | Defaults to `1`. |

  | `per_page` | query | no | `20` | Defaults to `20`. |

  | `q` | query | no | `loft` | Case-insensitive match on title, address, or district. |

  | `district_id` | query | no | `1` | Filters by property district. |

  | `property_type` | query | no | `apartment` | Filters by property type. |

  | `price_min` | query | no | `300` | Lower bound on effective monthly price. |

  | `price_max` | query | no | `800` | Upper bound on effective monthly price. |

  | `rooms_min` | query | no | `1` | Lower bound on room count. |

  | `rooms_max` | query | no | `3` | Upper bound on room count. |

  | `verified` | query | no | `True` | Filters on property verification. |

  | `furnishing` | query | no | `furnished` | Filters on furnishing type. |

  | `tariff` | query | no | `standard` | Filters on tariff tier. |

  | `sort` | query | no | `recent` | `recent` (default, favorite recency), `price_asc`, or `price_desc`. |


  Returns the mobile home card schema ordered by the requested sort (favorite
  `created_at` descending by default). Uses the same public availability rules as
  Home and the same filter semantics as the mobile home feed; silently omits
  favorites whose listings are no longer eligible. Every returned card includes
  `is_favorite=true`.


  ## Saved examples


  Examples are static source-backed contract fixtures. Capture runtime responses with
  the local environment when fixtures and providers are available.'
