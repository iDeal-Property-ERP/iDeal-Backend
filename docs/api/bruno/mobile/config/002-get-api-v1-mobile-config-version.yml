          value: no-store
      body:
        type: json
        data: "{\n  \"success\": true,\n  \"message\": \"OK\",\n  \"data\": {\n    \"update_type\": \"none\",\n    \"current_version\": \"1.0.0\",\n    \"latest_version\": \"1.0.0\",\n    \"store_url\": \"https://play.google.com/store/apps/details?id=com.ideal.mobile\"\n  }\n}"
  - name: validation_error
