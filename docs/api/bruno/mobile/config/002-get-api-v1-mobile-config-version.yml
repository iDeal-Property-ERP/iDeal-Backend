          value: no-store
      body:
        type: json
        data: "{\n  \"success\": true,\n  \"message\": \"OK\",\n  \"data\": {\n    \"update_type\": \"critical\",\n    \"current_version\": \"0.0.5\",\n    \"latest_version\": \"1.0.0\",\n    \"store_url\": \"https://apps.apple.com/app/id123456789\"\n  }\n}"
  - name: up_to_date
    request:
      url: "{{base_url}}/api/v1/mobile/config/version/"
      method: GET
      headers:
        - name: X-App-Platform
          value: android
