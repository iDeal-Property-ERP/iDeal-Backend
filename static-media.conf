# iDeal backend — static & media serving.
# Include this inside a host nginx `server { }` block:
#     include /home/mehroj/PycharmProjects/iDeal-Backend/static-media.conf;
#
# Files come from the dockerized backend's project-root ./cdn folder, which is
# bind-mounted into the container at /cdn:
#     collectstatic -> cdn/static, uploads -> cdn/media
# Adjust the `root` path below if the project lives elsewhere on the host.

location /static/ {
    root /home/mehroj/PycharmProjects/iDeal-Backend/cdn;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
}

location /media/ {
    root /home/mehroj/PycharmProjects/iDeal-Backend/cdn;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
}
